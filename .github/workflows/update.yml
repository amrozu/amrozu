name: Update profile card

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: amrozu/river-card@v1
        with:
          river: wisla
          name: Łukasz Amróz
          role: Tech Lead
          company: Property Group
          city: Warszawa
          output_dir: assets
